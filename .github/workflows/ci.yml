name: SitePulse checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sitepulse_test
          POSTGRES_PASSWORD: sitepulse_test
          POSTGRES_DB: sitepulse_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U sitepulse_test -d sitepulse_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://sitepulse_test:sitepulse_test@127.0.0.1:5433/sitepulse_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:check
      - run: pnpm test:integration
      - run: php --version && pnpm test:plugin
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - run: pnpm compose:check
