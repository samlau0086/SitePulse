name: Deploy SitePulse to VPS
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: sitepulse-deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      WEB_BIND_PORT: ${{ vars.WEB_BIND_PORT || (inputs.environment == 'production' && '3001' || '3000') }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER || 'sitepulse' }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB || 'sitepulse' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      AUTH_MAIL_FROM: ${{ vars.AUTH_MAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BARK_ENCRYPTION_KEY: ${{ secrets.BARK_ENCRYPTION_KEY }}
      NOTIFICATION_ENCRYPTION_KEY: ${{ secrets.NOTIFICATION_ENCRYPTION_KEY }}
      PLATFORM_ADMIN_USER_IDS: ${{ vars.PLATFORM_ADMIN_USER_IDS }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      MONITORING_ENABLED: ${{ vars.MONITORING_ENABLED || 'true' }}
      SECURITY_ADVISORIES_ENABLED: ${{ vars.SECURITY_ADVISORIES_ENABLED || 'true' }}
      MONITOR_INTERVAL_SECONDS: ${{ vars.MONITOR_INTERVAL_SECONDS || '300' }}
      SSL_INTERVAL_SECONDS: ${{ vars.SSL_INTERVAL_SECONDS || '86400' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Upload checked source and deploy over SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          phase='configuration validation'
          trap 'status=$?; echo "::error::Deployment failed during $phase (exit $status). See the preceding diagnostic; no credential values are printed." >&2' ERR
          fail() { echo "::error::$1" >&2; exit 1; }
          [[ "$DEPLOY_ENVIRONMENT" =~ ^(staging|production)$ ]] || fail 'Invalid deployment environment.'
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || fail 'Set VPS_HOST to a hostname or IPv4 address without protocol, port or path.'
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || fail 'Set VPS_USER to a valid Linux account name.'
          if [[ ! "$VPS_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( VPS_PORT > 65535 )); then fail 'VPS_PORT must be an SSH port from 1 to 65535.'; fi
          if [[ ! "$WEB_BIND_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( WEB_BIND_PORT > 65535 )); then fail 'WEB_BIND_PORT must be an application host port from 1 to 65535.'; fi
          [[ -n "$VPS_SSH_KEY" ]] || fail 'Set the VPS_SSH_KEY environment secret.'
          key="$RUNNER_TEMP/sitepulse-deploy-key"
          hosts="$RUNNER_TEMP/sitepulse-known-hosts"
          archive="$RUNNER_TEMP/sitepulse-release.tar.gz"
          config_archive="$RUNNER_TEMP/sitepulse-config.tar"
          config_directory="$RUNNER_TEMP/sitepulse-config"
          trap 'rm -f "$key" "$hosts" "$archive" "$config_archive"; rm -rf -- "$config_directory"' EXIT
          node --import tsx scripts/prepare-vps-config.mjs "$config_directory"
          tar -cf "$config_archive" -C "$config_directory" .env public-origin.txt backup-recipient.txt
          unset POSTGRES_PASSWORD BETTER_AUTH_SECRET RESEND_API_KEY BARK_ENCRYPTION_KEY NOTIFICATION_ENCRYPTION_KEY
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          phase='SSH host key discovery'
          if [[ -n "$VPS_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > "$hosts"
          else
            echo '::warning::VPS_KNOWN_HOSTS is unset. Automatically scanned keys are trusted for this run only; server identity is not independently verified and key changes across runs are not detected.'
            if ! ssh-keyscan -T 10 -p "$VPS_PORT" "$VPS_HOST" > "$hosts" 2>/dev/null || [[ ! -s "$hosts" ]]; then
              echo '::error::Unable to discover VPS SSH host keys. Check VPS_HOST, VPS_PORT and SSH connectivity.'
              exit 1
            fi
          fi
          unset VPS_SSH_KEY VPS_KNOWN_HOSTS
          ssh_options=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          root="/opt/sitepulse-$DEPLOY_ENVIRONMENT"
          release="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          phase='source archive'
          git archive --format=tar.gz "$GITHUB_SHA" > "$archive"
          phase='VPS setup and SSH authentication'
          echo 'Checking SSH access and automatically creating deployment directories.'
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "set -eu; umask 077; for dir in '$root' '$root/incoming' '$root/releases' '$root/shared' '$root/backups' '$root/logs'; do if ! mkdir -p -- \"\$dir\"; then echo \"VPS setup incomplete: cannot create deployment directory: \$dir\" >&2; exit 1; fi; if [ ! -d \"\$dir\" ] || [ ! -w \"\$dir\" ]; then echo \"VPS setup incomplete: directory is not writable: \$dir\" >&2; exit 1; fi; done"
          phase='source upload'
          scp "${ssh_options[@]}" -P "$VPS_PORT" "$archive" "$VPS_USER@$VPS_HOST:$root/incoming/$release.tar.gz"
          # Source and secrets use separate transfers; config travels only through SSH stdin.
          phase='remote build, backup, migration and health verification'
          echo "Deploying web on 127.0.0.1:$WEB_BIND_PORT (container port 3000)."
          ssh "${ssh_options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "set -eu; umask 077; mkdir '$root/releases/$release'; tar -xzf '$root/incoming/$release.tar.gz' -C '$root/releases/$release'; bash '$root/releases/$release/scripts/bootstrap-vps.sh' < /dev/null; bash '$root/releases/$release/scripts/deploy-vps.sh' '$DEPLOY_ENVIRONMENT' '$release' '$WEB_BIND_PORT' --configure-from-stdin; rm '$root/incoming/$release.tar.gz'" < "$config_archive"
